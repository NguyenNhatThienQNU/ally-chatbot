:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* Bố cục: một cột ứng dụng (đầu trang – vùng nội dung cuộn – thanh điều hướng), tối đa 820px, mép bên giữ khoảng an toàn */
:root {
  --bg: #EEF4F2;
  --bg-2: #E2ECE8;
  --surface: #FFFFFF;
  --ink: #12302C;
  --ink-2: #48645F;
  --ink-3: #6F8A85;
  --line: #D2E0DC;
  --brand: #0B7A69;
  --brand-strong: #075E51;
  --brand-soft: #D4EEE7;
  --on-brand: #FFFFFF;
  --sun: #EFAE33;
  --sun-soft: #FCEFD0;
  --sun-ink: #6A4800;
  --sos: #D3343C;
  --sos-strong: #A91F27;
  --sos-soft: #FCE4E3;
  --on-sos: #FFFFFF;
  --ok: #23824C;
  --ok-soft: #DCF2E4;
  --warn: #A86C10;
  --warn-soft: #FBEFD6;
  --ring-1: #8A63C9;
  --ring-2: #4A8FD8;
  --ring-3: #4FAF62;
  --ring-4: #EFC23C;
  --ring-5: #EF8A3A;
  --ring-6: #E05A5A;
  --shadow: 0 1px 2px rgba(18, 48, 44, .06), 0 8px 24px rgba(18, 48, 44, .08);
  --font-display: "Baloo 2", "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --fs: 1;
  --radius: 14px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1816; --bg-2: #11231F; --surface: #142824; --ink: #E3F0EC; --ink-2: #A8C1BC; --ink-3: #809B96;
    --line: #22403A; --brand: #3BC1A7; --brand-strong: #74DAC5; --brand-soft: #173B34; --on-brand: #03201A;
    --sun: #F2C25A; --sun-soft: #392D11; --sun-ink: #F6D892; --sos: #FF6669; --sos-strong: #FF9093; --sos-soft: #3E1A1C; --on-sos: #2A0607;
    --ok: #5DCB8C; --ok-soft: #173826; --warn: #E8B45A; --warn-soft: #3A2C12;
    --ring-1: #A88AE0; --ring-2: #6FAAE8; --ring-3: #72C784; --ring-4: #F2D06A; --ring-5: #F5A15F; --ring-6: #F07F7F;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1816; --bg-2: #11231F; --surface: #142824; --ink: #E3F0EC; --ink-2: #A8C1BC; --ink-3: #809B96;
  --line: #22403A; --brand: #3BC1A7; --brand-strong: #74DAC5; --brand-soft: #173B34; --on-brand: #03201A;
  --sun: #F2C25A; --sun-soft: #392D11; --sun-ink: #F6D892; --sos: #FF6669; --sos-strong: #FF9093; --sos-soft: #3E1A1C; --on-sos: #2A0607;
  --ok: #5DCB8C; --ok-soft: #173826; --warn: #E8B45A; --warn-soft: #3A2C12;
  --ring-1: #A88AE0; --ring-2: #6FAAE8; --ring-3: #72C784; --ring-4: #F2D06A; --ring-5: #F5A15F; --ring-6: #F07F7F;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; box-sizing: border-box; -webkit-text-size-adjust: 100%; }
body {
  height: 100%; margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: calc(16px * var(--fs)); line-height: 1.55;
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--brand-strong); }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- Khung ứng dụng ---------- */
.app { height: 100%; max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); position: relative; }
@media (min-width: 822px) { .app { border-inline: 1px solid var(--line); } }

.topbar { background: var(--surface); border-bottom: 1px solid var(--line); flex: none; }
.topbar-in { display: flex; align-items: center; gap: 6px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; margin-right: auto; background: none; border: 0; padding: 0; text-align: left; }
.brand-mark { width: 34px; height: 34px; flex: none; }
.brand-name { font-family: var(--font-display); font-weight: 800; font-size: 1.32rem; line-height: 1; letter-spacing: .01em; color: var(--ink); white-space: nowrap; }
.brand-sub { display: none; font-family: var(--font-body); font-weight: 500; font-size: .68rem; color: var(--ink-3); letter-spacing: .02em; margin-top: 3px; white-space: nowrap; }
.age-pill { display: inline-flex; align-items: center; gap: 3px; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 9px; font-size: .76rem; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
@media (min-width: 520px) { .brand-sub { display: block; } .topbar-in { gap: 8px; } .age-pill { padding: 4px 10px; font-size: .8rem; } }
.icon-btn { width: 38px; height: 38px; display: inline-grid; place-items: center; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); flex: none; transition: background .15s, border-color .15s, color .15s; }
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn:hover { background: var(--bg); }
.icon-btn.active-tts { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-strong); }
.exit-btn { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-size: .82rem; font-weight: 600; flex: none; }
.exit-btn svg { width: 18px; height: 18px; }
.exit-btn .lbl { display: none; }
@media (min-width: 480px) { .exit-btn .lbl { display: inline; } }
.sos-btn { height: 38px; padding: 0 12px; border-radius: 12px; border: 0; background: var(--sos); color: var(--on-sos); font-family: var(--font-display); font-weight: 800; font-size: 1rem; letter-spacing: .05em; flex: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 2px 0 var(--sos-strong); }
.sos-btn:active { transform: translateY(1px); box-shadow: none; }
.sos-btn .lbl { display: none; font-family: var(--font-body); font-size: .8rem; letter-spacing: 0; font-weight: 700; }
@media (min-width: 640px) { .sos-btn .lbl { display: inline; } }

.riskbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--bg-2); border-bottom: 1px solid var(--line); font-size: .76rem; color: var(--ink-2); }
.riskbar .meter { display: flex; gap: 3px; }
.riskbar .meter i { width: 18px; height: 7px; border-radius: 4px; background: var(--line); display: block; }
.riskbar[data-level="0"] .meter i:nth-child(1) { background: var(--ok); }
.riskbar[data-level="1"] .meter i:nth-child(-n+1) { background: var(--sun); }
.riskbar[data-level="2"] .meter i:nth-child(-n+2) { background: var(--warn); }
.riskbar[data-level="3"] .meter i { background: var(--sos); }
.riskbar[data-level="2"] { background: var(--warn-soft); color: var(--ink); }
.riskbar[data-level="3"] { background: var(--sos-soft); color: var(--sos-strong); }
.riskbar b { color: var(--ink); font-weight: 700; }
.risk-actions { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; }
.risk-btn { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--brand); background: var(--surface); color: var(--brand-strong); border-radius: 999px; padding: 3px 9px; font-size: .72rem; font-weight: 700; white-space: nowrap; }
.risk-btn svg { width: 13px; height: 13px; }
.risk-btn:hover { background: var(--brand-soft); }
.risk-btn.urgent { background: var(--sos); border-color: var(--sos); color: var(--on-sos); }
.risk-btn.quiet { border-color: var(--line); color: var(--ink-2); font-weight: 600; }

.views { flex: 1; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; min-height: 0; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.pad { padding-block: 18px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- Thanh điều hướng ---------- */
.tabbar { flex: none; background: var(--surface); border-top: 1px solid var(--line); }
.tabbar-in { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tab { position: relative; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 9px; color: var(--ink-3); font-size: .74rem; font-weight: 600; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--brand); }
.tab[aria-selected="true"]::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--brand); }
.tab .dot { position: absolute; top: 7px; left: calc(50% + 9px); width: 9px; height: 9px; border-radius: 50%; background: var(--sun); border: 2px solid var(--surface); }

/* ---------- Trò chuyện ---------- */
.chat-log { display: flex; flex-direction: column; gap: 14px; padding-block: 18px 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.msg { display: flex; gap: 8px; align-items: flex-end; max-width: 100%; }
.msg.user { justify-content: flex-end; }
.avatar { width: 30px; height: 30px; flex: none; align-self: flex-start; margin-top: 2px; }
.msg-body { min-width: 0; max-width: min(88%, 600px); display: flex; flex-direction: column; gap: 8px; }
.msg.user .msg-body { align-items: flex-end; }
.bubble { padding: 11px 14px; border-radius: 18px; line-height: 1.55; overflow-wrap: anywhere; }
.msg.bot .bubble { background: var(--surface); border: 1px solid var(--line); border-top-left-radius: 6px; box-shadow: 0 1px 1px rgba(18, 48, 44, .03); }
.msg.user .bubble { background: var(--brand); color: var(--on-brand); border-bottom-right-radius: 6px; white-space: pre-wrap; }
.bubble p { margin: 0 0 .6em; }
.bubble p:last-child, .bubble ul:last-child, .bubble ol:last-child { margin-bottom: 0; }
.bubble ul, .bubble ol { margin: .2em 0 .7em; padding-left: 1.25em; }
.bubble li { margin: .22em 0; }
.bubble li::marker { color: var(--brand); }
.bubble strong { font-weight: 700; }
.bubble .tel-inline { font-weight: 700; color: inherit; }
.msg-meta { font-size: .72rem; color: var(--ink-3); padding-inline: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.speak-btn { border: 0; background: none; padding: 2px 7px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 4px; font-size: .74rem; border-radius: 6px; transition: all .15s; }
.speak-btn svg { width: 14px; height: 14px; }
.speak-btn:hover { color: var(--brand); background: var(--bg-2); }
.speak-btn.speaking { color: var(--sos-strong); background: var(--sos-soft); font-weight: 700; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--brand); color: var(--brand-strong); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: .9rem; font-weight: 600; line-height: 1.25; text-align: left; }
.chip:hover { background: var(--brand-soft); }
.chip.big { padding: 11px 16px; font-size: .95rem; }
.chip.warn { border-color: var(--sos); color: var(--sos-strong); }
.chip.warn:hover { background: var(--sos-soft); }
.chip.ghost { border-color: var(--line); color: var(--ink-2); }
.chips.used .chip { opacity: .45; pointer-events: none; }
.chips.used .chip.picked { opacity: 1; background: var(--brand-soft); }
.age-chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.age-chips .chip { border-radius: 14px; display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; }
.age-chips .chip small { font-weight: 500; color: var(--ink-2); font-size: .76rem; }

.sources { font-size: .8rem; color: var(--ink-2); }
.sources summary { cursor: pointer; font-weight: 600; color: var(--ink-2); list-style: none; display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px; border-radius: 6px; }
.sources summary::-webkit-details-marker { display: none; }
.sources summary::before { content: "›"; display: inline-block; transition: transform .15s; font-weight: 800; }
.sources[open] summary::before { transform: rotate(90deg); }
.sources ul { margin: 6px 0 0; padding-left: 18px; }
.sources li { margin: 3px 0; }
.sources a { color: var(--brand-strong); }
.sources .pub { color: var(--ink-3); }

.feedback { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: .76rem; color: var(--ink-3); }
.fb-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px 3px 8px; display: inline-flex; gap: 4px; align-items: center; font-size: .76rem; color: var(--ink-2); }
.fb-btn svg { width: 14px; height: 14px; }
.fb-btn[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-strong); }
.fb-panel { background: var(--bg-2); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; font-size: .84rem; width: 100%; }
.fb-panel .chips .chip { font-size: .8rem; padding: 5px 10px; border-width: 1px; }
.fb-panel .chip[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }
.fb-panel textarea { width: 100%; min-height: 56px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 8px 10px; resize: vertical; }
.fb-thanks { font-size: .78rem; color: var(--ok); font-weight: 600; }

.alert-card { border-radius: 16px; border: 1.5px solid var(--sos); background: var(--sos-soft); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.alert-card h4 { margin: 0; font-size: .95rem; color: var(--sos-strong); }
.alert-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.call-btn { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--ink); min-width: 0; }
.call-btn .num { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; line-height: 1; color: var(--sos-strong); font-variant-numeric: tabular-nums; }
.call-btn .txt { font-size: .76rem; line-height: 1.3; color: var(--ink-2); min-width: 0; }
.call-btn .txt b { display: block; color: var(--ink); font-size: .84rem; }
.link-btn { border: 0; background: none; color: var(--sos-strong); font-weight: 700; font-size: .85rem; padding: 2px 0; text-align: left; text-decoration: underline; text-underline-offset: 3px; }

.typing { display: inline-flex; gap: 4px; padding: 14px 16px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); animation: blink 1.2s infinite ease-in-out; display: block; }
.typing i:nth-child(2) { animation-delay: .15s; }
.typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }

.composer { flex: none; background: var(--bg); padding-block: 8px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.quick { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; padding-inline: 4px; }
.quick::-webkit-scrollbar { display: none; }
.quick .chip { white-space: nowrap; font-size: .82rem; padding: 6px 12px; border-width: 1px; flex: none; }
.input-row { display: flex; align-items: flex-end; gap: 8px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 22px; padding: 5px 5px 5px 14px; }
.input-row:focus-within { border-color: var(--brand); }
.input-row textarea { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; resize: none; max-height: 132px; min-height: 24px; padding: 8px 0; line-height: 1.45; }
.round-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; display: grid; place-items: center; flex: none; background: var(--bg-2); color: var(--ink-2); }
.round-btn svg { width: 20px; height: 20px; }
.round-btn.send { background: var(--brand); color: var(--on-brand); }
.round-btn.send:disabled { opacity: .45; cursor: default; }
.round-btn.rec { background: var(--sos); color: var(--on-sos); animation: pulse 1.4s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--sos) 50%, transparent); } 100% { box-shadow: 0 0 0 12px transparent; } }
.privacy-note { font-size: .7rem; color: var(--ink-3); text-align: center; }

/* ---------- Tiêu đề trang ---------- */
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.view-head h1, .view-head h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; line-height: 1.1; text-wrap: balance; }
.eyebrow { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; margin-bottom: 4px; }
.lede { color: var(--ink-2); margin: 0 0 16px; max-width: 62ch; }
.age-switch { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--ink-2); }
.age-switch select { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 28px 6px 10px; font-weight: 600; font-size: .82rem; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }

.search { position: relative; margin-bottom: 16px; }
.search input { width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 11px 14px 11px 40px; }
.search input:focus { outline: 0; border-color: var(--brand); }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--ink-3); }

.topic-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 540px) { .topic-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.topic-card { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 14px; display: flex; gap: 12px; align-items: flex-start; }
.topic-card:hover { border-color: var(--brand); }
.topic-ico { width: 40px; height: 40px; border-radius: 12px; background: var(--brand-soft); color: var(--brand-strong); display: grid; place-items: center; flex: none; }
.topic-ico svg { width: 22px; height: 22px; }
.topic-card h3 { margin: 0 0 2px; font-size: 1rem; line-height: 1.3; }
.topic-card p { margin: 0; color: var(--ink-2); font-size: .82rem; line-height: 1.4; }
.topic-card .count { font-size: .72rem; color: var(--ink-3); font-weight: 600; margin-top: 6px; display: block; }

.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.list-item { display: flex; align-items: center; gap: 10px; padding: 13px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; width: 100%; }
.list-item:last-child { border-bottom: 0; }
.list-item:hover { background: var(--bg); }
.list-item .t { flex: 1; min-width: 0; font-weight: 600; }
.list-item .s { display: block; font-weight: 500; font-size: .76rem; color: var(--ink-3); }
.list-item svg { width: 18px; height: 18px; color: var(--ink-3); flex: none; }
.back-btn { border: 0; background: none; color: var(--brand-strong); font-weight: 700; display: inline-flex; align-items: center; gap: 4px; padding: 4px 0; margin-bottom: 10px; }
.back-btn svg { width: 18px; height: 18px; }

.article { max-width: 66ch; }
.article h1 { font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; line-height: 1.15; margin: 0 0 8px; text-wrap: balance; }
.article .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: .76rem; color: var(--ink-3); margin-bottom: 16px; }
.tag { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 9px; font-size: .72rem; font-weight: 700; background: var(--brand-soft); color: var(--brand-strong); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.sos { background: var(--sos-soft); color: var(--sos-strong); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.muted { background: var(--bg-2); color: var(--ink-2); }
.article .body p { margin: 0 0 .9em; }
.article .body ul, .article .body ol { padding-left: 1.3em; margin: 0 0 1em; }
.article .body li { margin: .3em 0; }
.article .body li::marker { color: var(--brand); font-weight: 700; }
.article .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0; }
.box { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 14px; }
.box h3 { margin: 0 0 8px; font-size: 1rem; }
.box + .box { margin-top: 12px; }
.src-list { margin: 0; padding-left: 18px; font-size: .86rem; }
.src-list li { margin: 4px 0; }
.src-list .pub { color: var(--ink-3); font-size: .78rem; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; padding: 10px 16px; font-weight: 700; font-size: .92rem; border: 1.5px solid var(--brand); background: var(--brand); color: var(--on-brand); text-decoration: none; line-height: 1.2; }
.btn svg { width: 18px; height: 18px; }
.btn.secondary { background: var(--surface); color: var(--brand-strong); }
.btn.quiet { background: var(--bg-2); color: var(--ink); border-color: transparent; }
.btn.danger { background: var(--sos); border-color: var(--sos); color: var(--on-sos); }
.btn.sm { padding: 6px 11px; font-size: .8rem; border-radius: 10px; border-width: 1px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }

/* ---------- Tình huống ---------- */
.quiz-hero { border-radius: 18px; background: var(--brand); color: var(--on-brand); padding: 18px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; position: relative; overflow: hidden; }
.quiz-hero h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.45rem; line-height: 1.15; text-wrap: balance; }
.quiz-hero p { margin: 0; opacity: .92; font-size: .9rem; }
.quiz-hero .status { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; font-weight: 600; }
.quiz-hero .status span { background: rgba(255, 255, 255, .16); background: color-mix(in srgb, var(--on-brand) 16%, transparent); border-radius: 999px; padding: 3px 10px; }
.quiz-hero .btn { background: var(--sun); border-color: var(--sun); color: #2B1E00; align-self: flex-start; }
.quiz-hero .status span.due { background: var(--sun); color: #2B1E00; }
.quiz-card { border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 16px; }
.quiz-progress { display: flex; align-items: center; gap: 10px; font-size: .78rem; color: var(--ink-3); font-weight: 700; margin-bottom: 12px; }
.quiz-progress .bar { flex: 1; height: 6px; background: var(--bg-2); border-radius: 4px; overflow: hidden; }
.quiz-progress .bar i { display: block; height: 100%; background: var(--brand); border-radius: 4px; transition: width .3s; }
.quiz-q { font-size: 1.08rem; font-weight: 600; line-height: 1.45; margin: 0 0 14px; }
.quiz-kind { display: inline-block; margin-bottom: 8px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; line-height: 1.4; }
.opt:hover:not(:disabled) { border-color: var(--brand); }
.opt .k { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--bg-2); font-weight: 800; font-size: .8rem; color: var(--ink-2); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .k { background: var(--ok); color: var(--surface); }
.opt.wrong { border-color: var(--sos); background: var(--sos-soft); }
.opt.wrong .k { background: var(--sos); color: var(--surface); }
.opt:disabled { cursor: default; }
.explain { margin-top: 12px; border-radius: 14px; padding: 12px 14px; background: var(--bg-2); font-size: .92rem; }
.explain b { display: block; margin-bottom: 2px; }
.result-score { font-family: var(--font-display); font-weight: 800; font-size: 3.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.result-score small { font-size: 1.2rem; color: var(--ink-3); }
.subscore { display: grid; grid-template-columns: 7.5em 1fr auto; gap: 10px; align-items: center; font-size: .84rem; margin: 6px 0; }
.subscore .bar { height: 8px; background: var(--bg-2); border-radius: 5px; overflow: hidden; }
.subscore .bar i { display: block; height: 100%; background: var(--brand); }
.history { font-size: .85rem; }
.history table { width: 100%; border-collapse: collapse; }
.history th, .history td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.history th { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }

/* ---------- Hỗ trợ ---------- */
.hotlines { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 16px; }
@media (min-width: 600px) { .hotlines { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.hotline { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.hotline .row { display: flex; align-items: baseline; gap: 10px; }
.hotline .num { font-family: var(--font-display); font-weight: 800; font-size: 2.4rem; line-height: 1; color: var(--sos-strong); font-variant-numeric: tabular-nums; user-select: all; }
.hotline .name { font-weight: 700; }
.hotline p { margin: 0; font-size: .82rem; color: var(--ink-2); }
.hotline .acts { display: flex; gap: 8px; margin-top: auto; }
.tools { display: grid; grid-template-columns: 1fr; gap: 12px; }
.tool { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 16px; }
.tool h3 { margin: 0 0 4px; font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; }
.tool > p { margin: 0 0 12px; color: var(--ink-2); font-size: .88rem; }

.hand-wrap { display: grid; grid-template-columns: 1fr; gap: 14px; align-items: center; }
@media (min-width: 560px) { .hand-wrap { grid-template-columns: 180px 1fr; } }
.hand-svg { width: 100%; max-width: 180px; justify-self: center; }
.hand-svg .finger, .hand-svg .palm { fill: var(--brand-soft); stroke: var(--brand); stroke-width: 2.5; }
.hand-svg .finger.filled { fill: var(--sun-soft); stroke: var(--sun); }
.hand-svg text { font-family: var(--font-display); font-weight: 800; font-size: 15px; fill: var(--brand-strong); text-anchor: middle; dominant-baseline: middle; }
.hand-fields { display: flex; flex-direction: column; gap: 8px; }
.hand-field { display: grid; grid-template-columns: 26px minmax(0, 1fr) minmax(0, .9fr); gap: 6px; align-items: center; }
.hand-field .n { width: 26px; height: 26px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-strong); font-weight: 800; font-size: .8rem; display: grid; place-items: center; }
.hand-field input { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 10px; font-size: .88rem; }
.hand-field input:focus { outline: 0; border-color: var(--brand); background: var(--surface); }
.note { font-size: .74rem; color: var(--ink-3); margin: 8px 0 0; }

.breath { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 8px 0; }
.breath-stage { width: 210px; height: 210px; display: grid; place-items: center; position: relative; }
.breath-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px dashed var(--line); }
.breath-ball { width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--brand-soft), var(--brand)); display: grid; place-items: center; color: var(--on-brand); font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; transform: scale(1); transition-property: transform; transition-timing-function: ease-in-out; box-shadow: 0 6px 30px color-mix(in srgb, var(--brand) 35%, transparent); text-align: center; line-height: 1.1; }
.breath-count { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; font-variant-numeric: tabular-nums; color: var(--brand-strong); min-height: 1.2em; }

.rings-wrap { display: grid; grid-template-columns: 1fr; gap: 14px; align-items: center; }
@media (min-width: 560px) { .rings-wrap { grid-template-columns: 220px 1fr; } }
.rings-svg { width: 100%; max-width: 220px; justify-self: center; }
.rings-svg text { font-family: var(--font-display); font-weight: 800; font-size: 11px; fill: #12302C; text-anchor: middle; dominant-baseline: middle; }
.rings-legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: .86rem; }
.rings-legend li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: start; }
.rings-legend .sw { width: 16px; height: 16px; border-radius: 50%; margin-top: 4px; box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--line); }
.rings-legend b { font-weight: 700; }

/* ---------- Bảng (sheet) ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 70; display: flex; align-items: flex-end; justify-content: center; background: rgba(7, 19, 17, .55); padding-top: max(24px, env(safe-area-inset-top, 0px)); }
@media (min-width: 640px) { .sheet-wrap { align-items: center; padding: 24px; } }
.sheet { width: 100%; max-width: 600px; max-height: 92%; background: var(--surface); border-radius: 22px 22px 0 0; display: flex; flex-direction: column; box-shadow: var(--shadow); animation: up .22s ease-out; }
@media (min-width: 640px) { .sheet { border-radius: 22px; max-height: 88vh; } }
@keyframes up { from { transform: translateY(24px); opacity: .4; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; align-items: center; gap: 10px; padding-block: 14px 10px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.sheet-head h2 { margin: 0; flex: 1; font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; line-height: 1.15; }
.sheet-body { overflow-y: auto; padding-block: 14px calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; }
.sheet.sos .sheet-head { background: var(--sos); color: var(--on-sos); border-radius: 22px 22px 0 0; border-bottom: 0; }
.sheet.sos .sheet-head .icon-btn { background: transparent; color: var(--on-sos); border-color: rgba(255, 255, 255, .45); border-color: color-mix(in srgb, var(--on-sos) 40%, transparent); }
.big-call { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 16px; border: 1.5px solid var(--line); text-decoration: none; color: var(--ink); background: var(--surface); }
.big-call .num { font-family: var(--font-display); font-weight: 800; font-size: 2.5rem; line-height: 1; color: var(--sos-strong); min-width: 2.4em; font-variant-numeric: tabular-nums; user-select: all; }
.big-call .txt { font-size: .84rem; color: var(--ink-2); line-height: 1.35; min-width: 0; }
.big-call .txt b { display: block; font-size: 1rem; color: var(--ink); }
.big-call.primary { border-color: var(--sos); background: var(--sos-soft); }
.steps { margin: 0; padding-left: 1.2em; font-size: .9rem; }
.steps li { margin: .25em 0; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: .84rem; }
.field label, .field .lab { font-weight: 600; color: var(--ink-2); }
.field input, .field textarea, .field select { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 11px; width: 100%; min-width: 0; }
.field textarea { resize: vertical; min-height: 90px; line-height: 1.45; }
.field input:focus, .field textarea:focus, .field select:focus { outline: 0; border-color: var(--brand); background: var(--surface); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .88rem; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--brand); flex: none; }
.callout { border-radius: 12px; padding: 10px 12px; font-size: .84rem; background: var(--brand-soft); color: var(--ink); }
.callout.warn { background: var(--warn-soft); }
.callout.sos { background: var(--sos-soft); }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.setting { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.setting .t { flex: 1 1 180px; }
.setting .btn { white-space: nowrap; }
.setting:last-child { border-bottom: 0; }
.setting .t { font-weight: 600; }
.setting .s { display: block; font-size: .76rem; color: var(--ink-3); font-weight: 400; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: none; }
.seg button { border: 0; background: var(--surface); padding: 6px 10px; font-size: .8rem; font-weight: 600; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }
.switch { position: relative; width: 46px; height: 28px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .15s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .15s; }
.switch input:checked + span { background: var(--brand); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 3px solid var(--sun); outline-offset: 2px; }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 12px; font-size: .86rem; font-weight: 600; z-index: 80; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; animation: up .2s ease-out; }

/* ---------- Quản trị ---------- */
.admin { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.admin-head { background: var(--ink); color: var(--surface); }

      a: {
        nho: `Xâm hại là khi có người làm đau cơ thể bạn, làm bạn sợ hãi hay buồn tủi, hoặc chạm vào vùng riêng tư của bạn.

Người đó có thể là người lạ, cũng có thể là người quen. Dù là ai thì làm vậy cũng là **sai**. Bạn có quyền nói KHÔNG, chạy đi, rồi kể ngay cho người lớn mà bạn tin.`,
        thcs: `Xâm hại trẻ em là bất kỳ hành vi nào làm tổn hại đến cơ thể, cảm xúc, tâm lý, danh dự hay nhân phẩm của trẻ em.

Các hình thức thường gặp:

- **Bỏ rơi, bỏ mặc**: không chăm sóc, nuôi dưỡng trẻ.
- **Mua bán, bắt cóc** trẻ em.

Người xâm hại có thể là người quen, thậm chí người trong gia đình. Dù là ai, bạn vẫn có quyền được bảo vệ.`,
        thpt: `Theo Luật Trẻ em 2016, xâm hại trẻ em là hành vi gây tổn hại về thể chất, tình cảm, tâm lý, danh dự, nhân phẩm của trẻ em, dưới các hình thức: bạo lực, bóc lột, xâm hại tình dục, mua bán, bỏ rơi, bỏ mặc và các hình thức gây tổn hại khác.

Luật này áp dụng cho người dưới 16 tuổi. Nếu bạn từ 16 đến dưới 18 tuổi, bạn là người chưa thành niên và vẫn được pháp luật bảo vệ trước bạo lực, quấy rối, xâm hại.

        lon: `Khoản 5 Điều 4 Luật Trẻ em 2016 quy định: “Xâm hại trẻ em là hành vi gây tổn hại về thể chất, tình cảm, tâm lý, danh dự, nhân phẩm của trẻ em dưới các hình thức bạo lực, bóc lột, xâm hại tình dục, mua bán, bỏ rơi, bỏ mặc trẻ em và các hình thức gây tổn hại khác.”

Trẻ em theo luật này là người dưới 16 tuổi (Điều 1). Nhiều vụ việc do chính người quen của trẻ gây ra, nên việc trò chuyện cởi mở trong gia đình và dạy trẻ kỹ năng tự bảo vệ là lớp bảo vệ đầu tiên.`

    {

        thcs: `Xâm hại tình dục là khi ai đó dùng vũ lực, đe dọa, ép buộc, lôi kéo hoặc dụ dỗ trẻ em tham gia vào các hành vi liên quan đến tình dục.

Xâm hại qua mạng (gạ gẫm, xin ảnh nhạy cảm, đe dọa phát tán) đang tăng và không chỉ đến từ người lạ. Xem thêm mục “Pháp luật xử lý thế nào?”.`

  quiz: [

    { id: "n2", ages: ["nho"], kind: "kt", ref: "vung-rieng-tu",

    { id: "n3", ages: ["nho"], kind: "up", ref: "bi-mat",

    { id: "n5", ages: ["nho"], kind: "up", ref: "ban-tay-tin-cay",

    { id: "n6", ages: ["nho"], kind: "kt", ref: "goi-111",

    { id: "n7", ages: ["nho"], kind: "up", ref: "nguoi-la-tren-mang",

    { id: "n9", ages: ["nho"], kind: "up", ref: "dau-hieu-canh-giac",

    { id: "n10", ages: ["nho"], kind: "kt", ref: "sau-vong-tron",

        const r = await fetch(u, { cache: 'no-store' });
        if (!r.ok) continue;
        const j = await r.json();
        if (!validData(j)) { status = status === 'none' ? 'invalid' : status; continue; }
        if (newer(j.version, DATA.version)) {
          DATA = j; store.set('data', j); indexData(); status = 'updated';
          ADMIN.lastSync = nowISO(); saveAdmin();
          if (manual) toast('Đã cập nhật dữ liệu mới (phiên bản ' + fmtDateTime(j.version) + ').');
          return status;
        }
        status = 'same';
      } catch (e) { /* mạng lỗi hoặc không có tệp */ }
    }
    ADMIN.lastSync = nowISO(); saveAdmin();
    if (manual) toast(status === 'same' ? 'Dữ liệu đang là bản mới nhất.' : status === 'invalid' ? 'Tệp dữ liệu từ xa không đúng định dạng.' : 'Không tải được dữ liệu từ xa. Ứng dụng vẫn dùng dữ liệu hiện có.');
    return status;
  }

  /* ---------------------------------------------------------------------
     4. TRẠNG THÁI & CÀI ĐẶT
     --------------------------------------------------------------------- */
  const SET = Object.assign({ age: null, font: 1, tts: false, theme: 'auto', saveChat: false }, store.get('settings', {}));
  SET.tts = false;
  const ADMIN = Object.assign({ pin: CONFIG.defaultPin, threshold: CONFIG.defaultThreshold, remoteUrl: '', feedbackUrl: '', demoRisk: true, logUnanswered: false, autoSync: true, lastSync: null }, store.get('admin', {}));
  function saveSettings() { store.set('settings', SET); }
  function saveAdmin() { store.set('admin', ADMIN); }

  const S = {
    tab: 'tro-chuyen',
    mode: 'normal',       // normal | safety | listening
    listenTurns: 0,
    risk: { session: 0, level: 0, cats: {}, lastSheetAt: 0 },
    transcript: [],
    lastEntry: null,
    scenarioAsked: [],
    lib: { view: 'topics', topic: null, entry: null, q: '' },
    quiz: { phase: 'home', items: [], i: 0, answers: [], age: null },
    adminTab: 'tong-quan',
    adminOpen: false,
    installEvt: null,
    origTheme: document.documentElement.getAttribute('data-theme')
  };
  const ageOf = () => SET.age || 'thcs';
  const ageLabel = (id) => ((DATA.ages || []).find((a) => a.id === id) || {}).label || id;
  const kidOr = (obj, age) => (age === 'nho' && obj.nho) ? obj.nho : (obj[age] || obj.chung);

  /* ---------------------------------------------------------------------
     5. KIỂM DUYỆT NỘI DUNG (bộ lọc đầu ra)
     --------------------------------------------------------------------- */
  const GUARD_DEFAULT = {
    blocked: {
      nho: ['hiếp', 'giao cấu', 'khiêu dâm', 'mại dâm', 'dâm ô', 'tình dục', 'tử hình', 'chung thân', 'tự tử', 'tự sát', 'cưỡng dâm', 'ấu dâm', 'khỏa thân', 'sinh dục', 'tống tiền'],
      thcs: ['giao cấu', 'tử hình', 'cưỡng dâm', 'ấu dâm', 'chung thân'],
      thpt: [], lon: []
    },
    harmful: ['là lỗi của bạn', 'lỗi của bạn là', 'tại bạn', 'bạn đáng bị', 'đừng kể với ai', 'giữ bí mật chuyện này', 'không nên kể', 'đừng gọi 111', 'im lặng là tốt nhất', 'tự giải quyết một mình', 'đừng báo công an'],
    maxWords: { nho: 28, thcs: 45 }
  };
  const GUARD = Object.assign(clone(GUARD_DEFAULT), store.get('guard', {}));
  const CHAIN = { nho: ['nho'], thcs: ['thcs', 'chung', 'thpt'], thpt: ['thpt', 'chung', 'thcs', 'lon'], lon: ['lon', 'chung', 'thpt'] };

  function phraseTokens(s) { return normText(s).split(' ').filter(Boolean); }
  function guardCheck(text, age) {
    const issues = [];
    const toks = phraseTokens(text);
    for (const w of (GUARD.blocked[age] || [])) {
      if (findSeq(toks, phraseTokens(w)).length) issues.push({ type: 'block', msg: `Có từ không phù hợp với nhóm ${ageLabel(age)}: “${w}”` });
    }
    const unquoted = phraseTokens(String(text).replace(/[“"][^”"]*[”"]/g, ' '));
    const NEG = new Set(['không', 'chẳng', 'chả', 'đâu']);
    for (const p of GUARD.harmful) {
      for (const pos of findSeq(unquoted, phraseTokens(p))) {
        const before = unquoted.slice(Math.max(0, pos - 3), pos);
        if (!before.some((t) => NEG.has(t))) { issues.push({ type: 'harm', msg: `Có cụm từ có thể gây hại: “${p}”` }); break; }
      }
    }
    const max = GUARD.maxWords[age];
    if (max) {
      const long = String(text).replace(/\*\*/g, '').split(/[.!?…\n]+/).map((x) => x.trim()).filter((x) => x.split(/\s+/).length > max);
      if (long.length) issues.push({ type: 'read', msg: `Có ${long.length} câu dài hơn ${max} chữ, có thể khó hiểu với nhóm ${ageLabel(age)}` });
    }
    return { ok: !issues.some((i) => i.type === 'block' || i.type === 'harm'), issues };
  }
  function logGuard(e, age, key, g) {
    const log = store.get('guardlog', []);
    log.unshift({ ts: Date.now(), entry: e.id, age, variant: key, issues: g.issues.map((i) => i.msg) });
    store.set('guardlog', log.slice(0, 200));
  }
  function reviewInfo(e) {
    const r = (e.raw && e.raw.review) || e.review || {};
    const at = r.at || META.ngayBienSoan || todayISO();
    const cyc = META.chuKyRaSoat || {};
    const cycle = Number(r.cycle) || (e.topic === 'phap-luat' ? (cyc['phap-luat'] || 90) : (cyc['mac-dinh'] || 180));
    const next = addDays(at, cycle);
    const days = diffDays(todayISO(), next);
    return { at, cycle, next, days, overdue: days < 0, soon: days >= 0 && days <= 14, by: r.by || META.nguoiRaSoatMacDinh || '', status: r.status || 'duyet' };
  }
  function isServable(e, age) { return (e.ages || []).includes(age) && reviewInfo(e).status === 'duyet'; }
  function resolveAnswer(e, age, silent) {
    for (const key of CHAIN[age] || ['chung']) {
      const t = e.a && e.a[key];
      if (!t || !t.trim()) continue;
      const g = guardCheck(t, age);
      if (g.ok) return { text: t, key, guard: g };
      if (!silent) logGuard(e, age, key, g);
    }
    return null;
  }
  function titleFor(e, age) { return (age === 'nho' && e.titleNho) ? e.titleNho : e.title; }

  /* ---------------------------------------------------------------------
     6. CẢM BIẾN NGUY CƠ
     --------------------------------------------------------------------- */
  function isNegated(T, p, NEG, BR) {
    if (p >= 1 && NEG.has(T[p - 1])) return true;
    if (p >= 2 && NEG.has(T[p - 2]) && BR.has(T[p - 1])) return true;
    return false;
  }
  function isIdiom(kw, T, p, mode) {
    for (const id of RISK.idioms) {
      if (id.kw.acc !== kw.acc) continue;
      if (p >= 1 && id[mode === 'acc' ? 'acc' : 'plain'].has(T[p - 1])) return true;
    }
    return false;
  }
  let QWORDS = null;
  function isQuestion(A) {
    QWORDS = QWORDS || ['gì', 'sao', 'thế nào', 'làm sao', 'bao nhiêu', 'ở đâu', 'có phải', 'được không', 'khi nào', 'bao giờ', 'là sao', 'nên làm', 'phải làm', 'có nên', 'có sao không'].map(prepKw);
    return /\?\s*$/.test(A.raw) || hit(A, QWORDS);
  }
  function assessRisk(A) {
    const R = RISK; const raw = {};
    const put = (cat, w) => { if (w > (raw[cat] || 0)) raw[cat] = w; };
    const fp = hit(A, R.fp), tp = hit(A, R.tp), urgent = hit(A, R.urg), info = hit(A, R.info);
    const modeW = (mode) => (mode === 'plain' ? (A.accented ? 0.5 : 0.85) : 1);
    const negOf = (mode) => (mode === 'acc' ? [R.NEG_ACC, R.BR_ACC] : [R.NEG_PLAIN, R.BR_PLAIN]);
    // 1) Từ khóa, cụm từ
    for (const rule of R.rules) {
      for (const kw of rule.kws) {
        const m = matchKw(A, kw);
        if (!m.pos.length) continue;
        const T = m.mode === 'acc' ? A.accT : A.plainT;
        const [NEG, BR] = negOf(m.mode);
        if (!m.pos.some((p) => !isNegated(T, p, NEG, BR) && !isIdiom(kw, T, p, m.mode))) continue;
        put(rule.cat, rule.w * kw.w * modeW(m.mode));
      }
    }
    // 2) Mẫu bị động: “bị (ai đó) đánh / sờ / dọa…”
    for (const mode of ['acc', 'plain']) {
      const T = mode === 'acc' ? A.accT : A.plainT;
      const BI = mode === 'acc' ? 'bị' : 'bi';
      const [NEG, BR] = negOf(mode);
      T.forEach((tok, i) => {
        if (tok !== BI || isNegated(T, i, NEG, BR)) return;
        const win = T.slice(i + 1, i + 5);
        for (const pv of R.passive) {
          for (const v of pv.verbs) {
            if (mode === 'plain' && v.n === 1 && v.hasAcc && !R.PLAIN_OK.has(v.plain)) continue;
            if (findSeq(win, mode === 'acc' ? v.accT : v.plainT).length) put(pv.cat, pv.w * 0.95 * modeW(mode));
          }
        }
      });
    }
    // 3) Cặp từ đứng gần nhau: “ép … quan hệ”, “dọa … tung ảnh”
    for (const pr of R.pairs) {
      for (const mode of ['acc', 'plain']) {
        if (mode === 'plain' && A.accented) continue;
        const T = mode === 'acc' ? A.accT : A.plainT;
        const key = mode === 'acc' ? 'accT' : 'plainT';
        const [NEG, BR] = negOf(mode);
        for (const a of pr.a) {
          for (const pa of findSeq(T, a[key])) {
            if (isNegated(T, pa, NEG, BR)) continue;
            const start = pa + a[key].length;
            const after = T.slice(start, start + pr.gap + 4);
            for (const b of pr.b) { const pb = findSeq(after, b[key]); if (pb.length && pb[0] <= pr.gap) put(pr.cat, pr.w * modeW(mode)); }
          }
        }
      }
    }
    // 4) Hiệu chỉnh theo ngữ cảnh: ngôi thứ nhất, nói về người khác, câu hỏi tìm hiểu
    const cats = {}; const hits = [];
    for (const [cat, w0] of Object.entries(raw)) {
      let w = w0;
      if (cat !== 'tu-hai' && cat !== 'nguy-hiem') {
        if (fp) w *= 1.25;
        if (tp) w *= 0.7;
        if (info) w *= 0.5;
      } else if (cat === 'nguy-hiem' && info) w *= 0.6;
      cats[cat] = w; hits.push({ cat, label: R.labels[cat] || cat, w });
    }
    if (urgent && fp && !info && !tp && (cats['bao-luc'] || cats['tinh-duc']) && !cats['nguy-hiem']) {
      cats['nguy-hiem'] = 3; hits.push({ cat: 'nguy-hiem', label: R.labels['nguy-hiem'], w: 3 });
    }
    const vals = Object.values(cats).sort((a, b) => b - a);
    const score = vals.length ? vals[0] + 0.4 * vals.slice(1).reduce((s2, v) => s2 + v, 0) : 0;
    let type = null;
    if (cats['tu-hai'] >= 2.5) type = (tp || (info && ageOf() === 'lon')) ? 'tu-hai-khac' : 'tu-hai';
    else if (cats['nguy-hiem'] >= 2.5 && !tp) type = 'nguy-hiem';
    const level = type ? 3 : score >= 4 ? 3 : score >= 2 ? 2 : score >= 1 ? 1 : 0;
    return { score, level, cats, hits, type, fp, tp, info, urgent };
  }
  function updateSessionRisk(r) {
    const R = S.risk;
    R.session = Math.min(10, R.session * 0.75 + r.score);
    const sessLevel = R.session >= 6 ? 2 : R.session >= 3 ? 2 : R.session >= 1.2 ? 1 : 0;
    R.level = Math.max(r.level, sessLevel);
    for (const [c, w] of Object.entries(r.cats)) R.cats[c] = Math.max(R.cats[c] || 0, w);
    renderRiskbar(r);
    return R.level;
  }
  function riskLabels() {
    return Object.entries(S.risk.cats).filter(([, w]) => w >= 0.6).sort((a, b) => b[1] - a[1]).map(([c]) => RISK.labels[c]).filter(Boolean);
  }

  /* ---------------------------------------------------------------------
     7. PHÂN TÍCH Ý ĐỊNH & TÌM CÂU TRẢ LỜI TRONG KHO
     --------------------------------------------------------------------- */
  const HELPER = new Set(['ban-be-ke', 'khi-tre-ke', 'trach-nhiem-bao-tin', 'dau-hieu-tre-bi-xam-hai']);

  function analyzeIntent(A, age, r) {
    const boosts = {};
    const add = (id, v) => { boosts[id] = (boosts[id] || 0) + v; };
    const p = A.plain;
    const n = A.plainT.length;

    // 1) Hỏi tên, danh tính, thông tin về ALLY
    if (/\b(ban|cau|em|chi|anh|ally|bot)\b.*\b(ten|la ai|nghia la gi|may tuoi|bao nhieu tuoi|o dau|nam hay nu|trai hay gai|nguoi hay may|robot|nguoi that)\b/.test(p) ||
        /\b(ten)\b.*\b(ban|cau|ally|la gi|gi)\b/.test(p) ||
        /\b(ai)\b.*\b(tao ra|lam ra|viet ra|xay dung|phat trien)\b/.test(p) ||
        /\b(gioi thieu)\b.*\b(ban than|ve ban|ve ally)\b/.test(p) ||
        /^(ban ten gi|ten la gi|ten gi|ban la ai|ally la ai|ally la gi)$/.test(p)) {
      add('ve-ban-an', 3.0);
    }

    // 2) Hỏi chức năng, cách dùng, ALLY giúp được gì
    if (/\b(ban|cau|ally|ung dung)\b.*\b(lam duoc gi|giup duoc gi|biet lam gi|co the giup|tac dung|chuc nang|tinh nang|de lam gi|ho tro gi)\b/.test(p) ||
        /\b(cach dung|cach su dung|huong dan su dung|dung the nao|hoi nhung gi|hoi duoc gi)\b/.test(p)) {
      add('cach-dung', 2.8);
    }

    // 3) Hỏi về ẩn danh, bảo mật, lộ thông tin, xóa lịch sử
    if (/\b(bi lo|lo thong tin|co ai biet|bo me co biet|nguoi khac biet|ai doc duoc|luu tin nhan|luu cuoc tro chuyen|xoa tin nhan|xoa lich su|an danh|bao mat|giu kin)\b/.test(p)) {
      add('an-danh', 2.6);
    }

    // 4) Hỏi thăm sức khỏe, trạng thái ALLY
    if (/\b(ban|cau|ally|dao nay|hom nay)\b.*\b(khoe khong|on khong|the nao|dang lam gi|an com chua|vui khong|met khong)\b/.test(p) ||
        /^(khoe khong|ban khoe khong|dang lam gi do)$/.test(p)) {
      add('khoe', 2.8);
    }

    // 5) Chào hỏi, gọi ALLY mở đầu
    if (n <= 6 && (!r || r.level === 0) &&
        /^(xin chao|chao|chao ban|chao ally|chao cau|hello|hi|alo|he lo|he nho|helu|ban oi|ally oi|cau oi|anh oi|chi oi|em oi|co ai khong|co ai o do khong|ban co do khong|cho minh hoi|cho em hoi|minh muon hoi|em muon hoi)$/.test(p)) {
      add('chao', 2.8);
    }

    // 6) Cảm ơn, tạm biệt, đồng ý ngắn
    if (n <= 7 && /\b(cam on|tks|thank|thanks|biet on ban)\b/.test(p)) add('cam-on', 2.6);
    if (n <= 7 && /\b(tam biet|bye|bai bai|good bye|hen gap lai|di ngu day|minh nghi day|chuc ngu ngon)\b/.test(p)) add('tam-biet', 2.8);
    if (n <= 4 && /^(ok|oke|okay|u|um|uh|vang|da|duoc roi|hieu roi|minh hieu roi|em hieu roi|da hieu|vang a|da vang)$/.test(p)) add('vang', 2.5);

    // 7) Muốn tâm sự, kể chuyện, cầu cứu chung
    if (/\b(muon ke|muon tam su|muon chia se|co chuyen muon noi|co chuyen kho noi|nghe minh ke|nghe em ke|khong biet noi voi ai|khong biet ke voi ai)\b/.test(p)) {
      add('muon-ke', 2.6);
    }

    // 8) Kỹ năng phòng tránh, tự bảo vệ
    if (/\b(phong tranh|phong chong|tu bao ve|ky nang bao ve|lam sao de khong bi|cach tranh bi)\b/.test(p)) {
      add('day-con', 2.2);
      add('dau-hieu-canh-giac', 1.8);
      add('khi-bi-xam-hai', 1.6);
    }

    // 9) Phân tích cấu trúc câu hỏi theo chủ đề chuyên biệt
    if (/\b(so|ngai|khong dam|lo)\b.*\b(ke|noi|tam su|bao|bo me|thay co|nguoi lon|mang|khong tin|tra thu)\b/.test(p) || /\b(ke voi ai|noi voi ai bay gio)\b/.test(p)) {
      add('ke-cho-ai', 2.4);
    }
    if (/\b(loi|tai|trach|xau ho|do ban|ghe tom)\b.*\b(minh|em|con|toi|ban than)\b/.test(p)) {
      add('khong-phai-loi', 2.4);
    }
    if (/\b(anh|hinh|clip|video|camera|cam)\b.*\b(xin|doi|gui|chup|nhay cam|nong|khoa than|rieng tu|coi)\b/.test(p) || /\b(lo gui anh|da gui anh)\b/.test(p)) {
      add('xin-anh', 2.4);
    }
    if (/\b(doa|tong tien|doi tien|uy hiep|ep)\b.*\b(anh|hinh|clip|video|tung|dang|phat tan|ghep)\b/.test(p) || /\b(ghep anh|cat ghep anh|ghep mat)\b/.test(p)) {
      add('bi-de-doa-anh', 2.5);
    }
    if (/\b(mang|facebook|zalo|tiktok|game|online)\b.*\b(nguoi la|lam quen|ket ban|ru gap|hen gap|nap the|tang qua)\b/.test(p)) {
      add('nguoi-la-tren-mang', 2.3);
    }
    if (/\b(mang|facebook|lop|nhom)\b.*\b(noi xau|boc phot|beu reu|beu xau|gia mao|nick gia|chui)\b/.test(p)) {
      add('bat-nat-tren-mang', 2.4);
    }
    if (/\b(nguoi yeu|ban trai|ban gai|hen ho|yeu duong)\b.*\b(ep|doi|kiem soat|ghen|danh|doa|chia tay|dong y|dong thuan)\b/.test(p)) {
      add('tinh-yeu-an-toan', 2.4);
    }
    if (/\b(ban than|ban minh|ban em|ban cung lop|ban be)\b.*\b(bi|ke|xam hai|danh|quay roi|sam so)\b/.test(p)) {
      add('ban-be-ke', 2.4);
    }
    if (/\b(bo|me|ba|ma|nguoi nha|gia dinh|duong)\b.*\b(danh|chui|mang|nhot|say ruou|bao hanh|bao luc)\b/.test(p)) {
      add('bi-danh-o-nha', 2.3);
    }
    if (/\b(bat nat|tay chay|co lap|danh hoi dong|treu choc|xin deu|bao luc hoc duong)\b/.test(p)) {
      add('bat-nat', 2.4);
    }
    if (/\b(111|tong dai|duong day nong|hotline)\b/.test(p)) add('goi-111', 2.3);
    if (/\b(113|115|cong an|canh sat|cap cuu)\b/.test(p) && /\b(goi|so|khi nao|bao)\b/.test(p)) add('khi-nao-goi-113-115', 2.3);
    if (/\b(di tu|bi phat|muc an|xu ly hinh su|bo luat hinh su|co bi bat|bao nhieu nam tu)\b/.test(p)) add('phap-luat-hinh-su', 2.3);
    if (/\b(quyen tre em|luat tre em|bao nhieu tuoi la tre em|duoi 16 tuoi)\b/.test(p)) add('quyen-tre-em', 2.2);
    if (/\b(nguyen nhan|hau qua|tac hai|thuc trang|so lieu|thong ke|nghien cuu khoa hoc|de tai)\b/.test(p)) add('nguyen-nhan-hau-qua', 2.5);
    if (/\b(bao luc tinh than|xam hai tinh than|bao luc ngon tu|miet thi ngoai hinh|body shaming|bodyshaming|che beo|che xau)\b/.test(p)) add('xam-hai-tinh-than', 2.5);
    if (/\b(noi cong cong|xe buyt|xe bus|thang may|nha ve sinh|phong thay do|quay len|chup len|nhin len|camera giau kin)\b/.test(p)) add('quay-roi-cong-cong', 2.5);
    if (/\b(ap luc hoc tap|diem kem|thi truot|chan hoc|bo me khong hieu|bo me cai nhau|bo me ly hon|that tinh|co don)\b/.test(p)) add('ap-luc-hoc-tap-gia-dinh', 2.4);

    return boosts;
  }

  function retrieve(A, age, r) {
    const out = [];
    const boosts = analyzeIntent(A, age, r);
    for (const e of KB.list) {
      if (!isServable(e, age)) continue;
      const ks = [];
      for (const kw of e._k) {
        const m = matchKw(A, kw, true);
        if (m.pos.length) ks.push(kw.w * (m.factor || 1) * (1 + 0.45 * (kw.n - 1)) * (m.mode === 'plain' ? (A.accented ? 0.65 : 0.9) : 1));
      }
      ks.sort((a, b) => b - a);
      const kwScore = (ks[0] || 0) + 0.5 * (ks[1] || 0) + 0.25 * (ks[2] || 0);
      let qScore = 0;
      for (const qs of e._q) qScore = Math.max(qScore, dice(A.set, qs));
      const intentScore = boosts[e.id] || 0;
      let s = kwScore + 2.6 * qScore + intentScore;
      if (e.small && A.accT.length > 7 && !intentScore) s *= 0.35; // câu dài thì không coi là chào hỏi xã giao trừ khi đúng ý định
      if (r && r.tp && HELPER.has(e.id) && s > 0) s += 1.5; // đang hỏi để giúp người khác
      if (s > 0) out.push({ e, s, kwScore, qScore, intentScore });
    }
    out.sort((a, b) => b.s - a.s);
    return out;
  }

  /* ---------------------------------------------------------------------
     8. LỜI THOẠI
     --------------------------------------------------------------------- */

  function renderChips(chips, opts = {}) {

  function addBot(text, opts = {}) {

  function setQuick() {

  async function handleChip(c) {
    const age = ageOf();
    switch (c.act) {
      case 'age': {
        addUser(c.label);
        setAge(c.val);
        await botSay(MSG.ageSet.replace('{label}', ageLabel(c.val)) + '\n\n' + INTRO[c.val] + ' Hoặc chọn một câu bên dưới:', { chips: chipsFrom(POPULAR[c.val]) });
        maybeQuizReminder();
        break;
      }
      case 'ask': addUser(c.val || c.label); await respond(c.val || c.label); break;
      case 'entry': {
        const e = KB.byId.get(c.val);
        addUser(c.label.replace(/^Có phải bạn muốn hỏi: /, ''));
        if (e) await answerEntry(e); else await fallback();
        break;
      }
      case 'disclose': addUser(c.label); await startDisclosure('manual'); break;
      case 'safe': addUser(c.label); S.mode = 'listening'; S.listenTurns = 0; setQuick(); await botSay(age === 'lon' ? MSG.safe.lon : kidOr(MSG.safe, age), { chips: age === 'lon' ? [{ label: 'Các bước nên làm', act: 'nextsteps' }, { label: 'Khi trẻ kể bị xâm hại', act: 'entry', val: 'khi-tre-ke' }, { label: 'Chuẩn bị nội dung gọi 111', act: 'package' }] : [{ label: 'Mình chưa muốn kể', act: 'stop', cls: 'ghost' }] }); break;
      case 'talk': addUser(c.label); S.mode = 'listening'; S.listenTurns = 0; setQuick(); await botSay(kidOr(MSG.talk, age)); break;
      case 'unsure': addUser(c.label); S.mode = 'listening'; S.listenTurns = 0; setQuick(); await botSay(kidOr(MSG.unsure, age), { alert: 'manual' }); break;
      case 'danger': addUser(c.label); await respondDanger(); break;
      case 'nextsteps': addUser(c.label); await nextSteps(); break;
      case 'package': addUser(c.label); await botSay('Mình mở khung **Chuẩn bị nội dung gọi 111**. Bạn có thể sửa hoặc xóa bất kỳ phần nào trước khi dùng.', { instant: true }); openPackage(); break;
      case 'stop': addUser(c.label); S.mode = 'normal'; setQuick(); await botSay(kidOr(MSG.stop, age), { chips: chipsFrom(POPULAR[age]).slice(1, 4) }); break;
      case 'scenario': addUser(c.label); await startScenario(); break;
      case 'sc-answer': await answerScenario(c.val); break;
      case 'emergency': openEmergency('manual'); break;
      case 'tab': addUser(c.label); goTab(c.val); break;
      case 'tool': goTab('ho-tro'); setTimeout(() => { const el = $('#tool-' + c.val, $('#helpRoot')); if (el) el.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' }); }, 60); break;
      default: break;
    }
  }

  // Phân tích khi người dùng tự giới thiệu bản thân (độ tuổi, lớp, sinh viên, giáo viên, phụ huynh, tên...)
  function detectUserProfile(A) {
    const p = A.plain;
    const acc = A.acc;
    let role = null;
    let targetAge = null;
    let userName = null;

    // 1. Trích xuất tên người dùng nếu họ tự giới thiệu ("tôi tên là Thảo", "mình tên Nam")
    const nameMatch = acc.match(/\b(?:tôi|mình|em|con|tớ)\s+tên\s+(?:là\s+)?([a-zA-ZÀ-ỹ]{2,15})\b/i);
    if (nameMatch && !/^(gì|ai|là|gọi|như|thế|nào|vậy|đó|này|ally)$/i.test(nameMatch[1])) {
      userName = nameMatch[1].charAt(0).toUpperCase() + nameMatch[1].slice(1);
      S.userName = userName;
    }

    // 2. Nhận diện vai trò / cấp học / độ tuổi của người dùng (khi chủ ngữ là người dùng hoặc câu khai báo ngắn)
    const isAboutBot = /\b(ban|cau|ally|bot)\b.*\b(may tuoi|bao nhieu tuoi|hoc lop|la ai|ten)\b/.test(p);
    if (!isAboutBot) {
      const ageNum = p.match(/\b(\d{1,2})\s*tuoi\b/);
      const gradeNum = p.match(/\blop\s*(\d{1,2})\b/);

      if (/\b(sinh vien|dai hoc|cao dang|nam nhat|nam hai|nam ba|nam tu|nam cuoi)\b/.test(p)) {
        role = 'sinh-vien'; targetAge = 'lon';
      } else if (/\b(giao vien|thay giao|co giao|giang vien|nha giao|tong phu trach|can bo doan|tu van tam ly)\b/.test(p) && /\b(toi|minh|la)\b/.test(p)) {
        role = 'giao-vien'; targetAge = 'lon';
      } else if (/\b(phu huynh|lam cha|lam me|bo cua|me cua|co con nho|nguoi lon|di lam roi)\b/.test(p) && /\b(toi|minh|la)\b/.test(p)) {
        role = 'phu-huynh'; targetAge = 'lon';
      } else if (gradeNum) {
        const g = parseInt(gradeNum[1], 10);
        if (g >= 1 && g <= 5) { role = 'hoc-sinh-nho'; targetAge = 'nho'; }
        else if (g >= 6 && g <= 9) { role = 'hoc-sinh-thcs'; targetAge = 'thcs'; }
        else if (g >= 10 && g <= 12) { role = 'hoc-sinh-thpt'; targetAge = 'thpt'; }
      } else if (ageNum) {
        const y = parseInt(ageNum[1], 10);
        if (y >= 4 && y < 11) { role = 'hoc-sinh-nho'; targetAge = 'nho'; }
        else if (y >= 11 && y <= 14) { role = 'hoc-sinh-thcs'; targetAge = 'thcs'; }
        else if (y >= 15 && y <= 17) { role = 'hoc-sinh-thpt'; targetAge = 'thpt'; }
        else if (y >= 18) { role = 'nguoi-lon'; targetAge = 'lon'; }
      } else if (/\b(tieu hoc|cap 1|mam non)\b/.test(p) && A.plainT.length <= 8) {
        role = 'hoc-sinh-nho'; targetAge = 'nho';
      } else if (/\b(cap 2|thcs|trung hoc co so)\b/.test(p) && A.plainT.length <= 8) {
        role = 'hoc-sinh-thcs'; targetAge = 'thcs';
      } else if (/\b(cap 3|thpt|trung hoc pho thong)\b/.test(p) && A.plainT.length <= 8) {
        role = 'hoc-sinh-thpt'; targetAge = 'thpt';
      } else if (/\b(hoc sinh)\b/.test(p) && /\b(toi|minh|em|con|to|la)\b/.test(p) && A.plainT.length <= 7) {
        role = 'hoc-sinh'; targetAge = SET.age || 'thcs';
      }
    }

    if (!role && !userName) return null;
    return { role, targetAge, userName };
  }

  async function replyUserProfile(prof) {

    const age = ageOf();

      chips = [

    } else if (prof.role === 'giao-vien') {

    } else if (prof.role === 'phu-huynh' || prof.role === 'nguoi-lon') {
      msg = `${greetName}Mình đã chuyển chế độ trò chuyện sang nhóm **Người lớn**. ALLY sẵn sàng đồng hành cùng bạn trong việc dạy trẻ kỹ năng tự bảo vệ theo từng độ tuổi, bảo vệ con trên môi trường mạng, nhận biết dấu hiệu bất thường và cách phản ứng đúng khi trẻ kể chuyện.`;
    } else if (prof.role === 'hoc-sinh-thpt') {
      msg = `${greetName}Mình đã điều chỉnh nội dung phù hợp với lứa tuổi **15–18 tuổi (THPT)** của bạn. Bạn có thể hỏi mình về sự đồng thuận và ranh giới trong tình cảm, an toàn trên mạng, quy định pháp luật, hoặc tâm sự chuyện học tập, gia đình nhé!`;
    } else if (prof.role === 'hoc-sinh-thcs') {
      msg = `${greetName}Mình đã điều chỉnh nội dung phù hợp với lứa tuổi **11–14 tuổi (THCS)** của bạn. Bạn có thể tìm hiểu cách ứng phó bắt nạt học đường, cảnh giác người lạ trên mạng, bảo vệ vùng riêng tư, hoặc kể chuyện làm bạn lo lắng nhé!`;
    } else if (prof.role === 'hoc-sinh-nho') {
      msg = `${greetName}Mình đã chọn chế độ dành cho các bạn **Dưới 11 tuổi (Tiểu học)** để nói chuyện thật dễ hiểu với bạn nhé. Bạn có muốn tìm hiểu về Vùng riêng tư, Bí mật xấu, Bàn tay tin cậy hay chơi câu đố tình huống cùng ALLY không?`;
    } else if (prof.role === 'hoc-sinh') {
      msg = `${greetName}Rất vui được làm người bạn đồng hành của bạn. Bạn có thể cho mình biết thêm bạn đang học lớp mấy (hoặc bao nhiêu tuổi) để mình điều chỉnh nội dung sát nhất, hoặc chọn ngay một chủ đề bạn đang quan tâm bên dưới nhé!`;
    } else {
      msg = `${greetName}Rất vui được làm quen với bạn! Mình là **ALLY** – người bạn đồng hành luôn sẵn sàng lắng nghe và hỗ trợ bạn. Hôm nay bạn muốn tìm hiểu kiến thức hay có chuyện gì muốn tâm sự cùng mình không?`;

  async function respond(text) {
    const A = analyze(text);
    const r = assessRisk(A);
    const prof = detectUserProfile(A);
    if (prof && prof.targetAge && prof.targetAge !== SET.age) {
      setAge(prof.targetAge);
    }
    const age = ageOf();
    const level = updateSessionRisk(r);
    const matches = retrieve(A, age, r);
    const top = matches[0];
    const thr = Number(ADMIN.threshold) || CONFIG.defaultThreshold;

    // 1) Khủng hoảng: ý nghĩ tự hại, nguy hiểm ngay lúc này
    if (r.type === 'tu-hai') return respondCrisis();
    if (r.type === 'tu-hai-khac') return botSay(MSG.crisisOther, { alert: 'tu-hai', chips: [{ label: 'Gọi 111 nói gì?', act: 'entry', val: 'goi-111' }, { label: 'Bạn bè kể bị xâm hại', act: 'entry', val: 'ban-be-ke' }] });
    if (r.type === 'nguy-hiem') return respondDanger();

    // 1b) Nếu đang có câu hỏi tình huống đang chờ trả lời và người dùng gõ đáp án A / B / C
    if (S.activeScenario) {
      const scMatch = A.plain.match(/^(?:chon\s+|dap an\s+|cau\s+|y\s+|phuong an\s+)?([abc])(?:\b|\.)/i);
      if (scMatch && A.plainT.length <= 4) {
        const idx = scMatch[1].toLowerCase().charCodeAt(0) - 97;
        const scId = S.activeScenario;
        S.activeScenario = null;
        return answerScenario({ id: scId, i: idx, fromText: true });
      }
      S.activeScenario = null;
    }

    // 2) Nếu người dùng tự giới thiệu bản thân (ví dụ: "tôi là sinh viên", "em học lớp 7", "mình tên Thảo") mà chưa kèm câu hỏi chuyên môn khác
    if (prof && r.level === 0 && (!top || top.s < thr * 1.1) && A.plainT.length <= 10) {
      S.mode = 'normal'; setQuick();
      return replyUserProfile(prof);
    }

    // 3) Đang lắng nghe (người dùng đang kể) — tự thoát chế độ lắng nghe nếu người dùng chuyển sang hỏi chủ đề cụ thể hoặc phản hồi về bot
    if (S.mode === 'listening' || S.mode === 'safety') {
      if (/\b(van do|do qua|do ec|te qua|sai roi|khong hieu y|chua hieu y|ma pin|trang quan tri)\b/.test(A.plain)) {
        S.mode = 'normal'; setQuick();
        return fallback(text, r, matches, A);
      }
      if (S.mode === 'safety' && A.plainT.length <= 7) {
        if (/\b(khong an toan|dang nguy hiem|rat so|cuu)\b/.test(A.plain)) return respondDanger();
        if (/\b(an toan|dang an toan|on roi|minh on)\b/.test(A.plain) && !/\bkhong\b/.test(A.plain)) {
          S.mode = 'listening'; S.listenTurns = 0; setQuick();
          return botSay(age === 'lon' ? MSG.safe.lon : kidOr(MSG.safe, age), { chips: age === 'lon' ? [{ label: 'Các bước nên làm', act: 'nextsteps' }, { label: 'Khi trẻ kể bị xâm hại', act: 'entry', val: 'khi-tre-ke' }, { label: 'Chuẩn bị nội dung gọi 111', act: 'package' }] : [{ label: 'Mình chưa muốn kể', act: 'stop', cls: 'ghost' }] });
        }
      }
      if (top && top.s >= 0.65 && (r.level === 0 || isQuestion(A) || top.s >= 1.5)) {
        if (top.e.id === 'tam-biet' || top.s >= 1.2) { S.mode = 'normal'; setQuick(); }
        await answerEntry(top.e, { alert: r.level >= 2 ? 'manual' : null });
        return;
      }
      return respondListening(r, top && top.s >= thr && !top.e.small && !top.e.action ? top.e : null);
    }

    // 4) Đang hỏi để giúp người khác (bạn bè, con, học sinh)
    if (r.tp && r.level >= 2) {
      const helper = KB.byId.get(age === 'lon' ? 'khi-tre-ke' : 'ban-be-ke');
      const best = (top && top.s >= thr && HELPER.has(top.e.id)) ? top.e : helper;
      if (best && isServable(best, age)) return answerEntry(best, { alert: 'manual' });
    }

    // 5) Có dấu hiệu bị xâm hại: nếu khớp rõ một bài hướng dẫn cụ thể (hoặc là câu hỏi cách xử lý) thì trả lời ngay bài đó kèm lời đồng cảm & thẻ khẩn cấp; nếu chỉ mới bộc lộ chung thì hỏi thăm an toàn
    if (r.level >= 2) {
      if (top && top.s >= 0.9 && !top.e.small && !top.e.action && (isQuestion(A) || !r.fp || top.s >= 1.4)) {
        const cat = topCat(r);
        const ack = (r.fp && cat && MSG.listen[cat]) ? kidOr(MSG.listen[cat], age) : null;
        return answerEntry(top.e, { prefix: ack, alert: 'manual' });
      }
      return startDisclosure('detected', r);
    }

    // 6) Trả lời theo kho kiến thức & phân tích ý định (kể cả khi khớp ngữ nghĩa mức vừa >= 0.45)
    if (top && top.s >= 0.45) {
      const second = matches[1];
      const alt = (second && second.s >= 0.5 && second.s >= top.s * 0.8 && !second.e.small && !second.e.action) ? second.e : null;
      let prefix = null;
      if (r.level === 1 && !top.e.action && !top.e.small) prefix = r.cats['cam-xuc'] ? MSG.prefix1['cam-xuc'] : MSG.prefix1.generic;
      return answerEntry(top.e, { prefix, alt });
    }

    // 7) Câu hỏi nối tiếp theo ngữ cảnh chủ đề vừa trao đổi
    if (S.lastEntry && /\b(con gi nua|tiep theo|noi ro hon|cu the hon|vay phai lam sao|vay nen lam gi|the thi sao|roi sao nua|sao nua)\b/.test(A.plain)) {
      const prev = KB.byId.get(S.lastEntry);
      const nextId = prev && (prev.next || []).find((id) => KB.byId.get(id) && isServable(KB.byId.get(id), age));
      if (nextId) return answerEntry(KB.byId.get(nextId));
    }

    if (prof) return replyUserProfile(prof);
    if (r.cats['cam-xuc'] && KB.byId.get('cam-xuc')) return answerEntry(KB.byId.get('cam-xuc'), { prefix: MSG.prefix1['cam-xuc'] });
    return fallback(text, r, matches, A);
  }

  async function answerEntry(e, opts = {}) {
    const age = ageOf();
    if (e.action) return runAction(e.action);
    const res = resolveAnswer(e, age);
    if (!res) return botSay(age === 'nho' ? MSG.kidsafe.nho : MSG.kidsafe.chung, { chips: chipsFrom(POPULAR[age]).slice(0, 4) });
    let text = res.text;
    if (opts.prefix) text = opts.prefix + '\n\n' + text;
    const rv = reviewInfo(e);
    const note = (e.topic === 'phap-luat' && rv.overdue) ? 'Nội dung pháp luật này đã quá hạn rà soát định kỳ. Hãy đối chiếu với nguồn chính thống bên dưới.' : null;
    const chips = [];
    if (opts.alt) chips.push({ label: 'Có phải bạn muốn hỏi: ' + titleFor(opts.alt, age), act: 'entry', val: opts.alt.id, cls: 'ghost' });
    (e.next || []).map((id) => KB.byId.get(id)).filter((x) => x && isServable(x, age)).slice(0, 3)
      .forEach((x) => chips.push({ label: titleFor(x, age), act: 'entry', val: x.id }));
    if (e.tool) chips.push({ label: e.tool === 'ban-tay' ? 'Ghi bàn tay tin cậy' : e.tool === 'hit-tho' ? 'Hít thở cùng ALLY' : 'Xem hình 6 vòng tròn', act: 'tool', val: e.tool, cls: 'ghost' });
    if (e.small && !(e.next || []).length) chips.push(...chipsFrom(POPULAR[age]).slice(0, 3));
    S.lastEntry = e.id;
    return botSay(text, { entry: e, chips, feedback: !e.small, note, alert: opts.alert || null });
  }

  async function runAction(action) {
    const age = ageOf();
    if (action === 'greet') return botSay(GREET[age], { chips: chipsFrom(POPULAR[age]) });
    if (action === 'disclose') return startDisclosure('manual');
    if (action === 'scenario') return startScenario();
    if (action === 'emergency') { await botSay('Mình mở khung khẩn cấp để bạn gọi nhanh **113**, **111** hoặc **115**.', { instant: true }); return openEmergency('manual'); }
    return fallback();
  }

  async function fallback(text, r, matches, A) {
    const age = ageOf();
    if (text && ADMIN.logUnanswered) {
      const log = store.get('unanswered', []);
      log.unshift({ ts: Date.now(), age, text: scrub(text).slice(0, 200) });
      store.set('unanswered', log.slice(0, 300));
    }
    const p = A ? A.plain : stripVN(normText(text || ''));
    const suggested = (matches || []).filter((m) => m.s >= 0.22 && !m.e.small && !m.e.action).slice(0, 3)
      .map((m) => ({ label: titleFor(m.e, age), act: 'entry', val: m.e.id }));
    const chips = suggested.length ? [...suggested, ...chipsFrom(POPULAR[age]).slice(0, 2)] : chipsFrom(POPULAR[age]).slice(0, 4);

    // 1. Khi người dùng nhận xét / phàn nàn về câu trả lời của chatbot ("vẫn dở", "dở quá", "sai rồi", "không hiểu ý")
    if (/\b(van do|do qua|do ec|te qua|sai roi|khong hieu y|chua hieu y|may moc|ngu qua|ngoc qua|chan qua|khong dung)\b/.test(p)) {
      return botSay(
        'Mình xin lỗi vì câu trả lời vừa rồi chưa thật sự đúng ý bạn nhé! Mình vẫn đang cố gắng hoàn thiện hơn.\n\nBạn có thể nói cụ thể hơn một chút về vấn đề bạn muốn trao đổi (ví dụ: **kiến thức pháp luật**, **kỹ năng phòng tránh**, **an toàn trên mạng**, hay **một tình huống thực tế** bạn đang gặp) để mình hỗ trợ chính xác nhất được không?',
        { chips }
      );
    }

    // 2. Khi người dùng hỏi về mã PIN hoặc trang quản trị
    if (/\b(ma pin|trang quan tri|vao quan tri|admin)\b/.test(p)) {
      return botSay(
        'Để mở **Trang Quản trị nội dung** (dành cho nhóm nghiên cứu và giáo viên), bạn có thể gõ lệnh `/quantri` vào ô chat hoặc nhấn giữ vào chữ **ALLY** ở góc trên bên trái màn hình (mã PIN mặc định: **2026**).',
        { chips }
      );
    }

    // 3. Khi người dùng chia sẻ một câu trần thuật cá nhân ("tôi đang...", "mình muốn...", "hôm nay mình...")
    if (/\b(toi|minh|em|con|to)\b/.test(p) && !isQuestion(A || analyze(text || ''))) {
      return botSay(
        'Mình đang lắng nghe bạn đây. Bạn cứ chia sẻ cụ thể hơn câu chuyện hoặc điều bạn đang băn khoăn nhé (chuyện ở trường, ở nhà, trên mạng hay một thắc mắc bạn muốn tìm lời giải). Bạn cũng có thể chọn nhanh một chủ đề gợi ý bên dưới:',
        { chips, alert: r && r.level >= 1 ? 'manual' : null }
      );
    }

    const msg = suggested.length
      ? 'Mình phân tích thấy điều bạn hỏi có liên quan đến các nội dung dưới đây. Bạn hãy bấm vào chủ đề đúng ý bạn nhất, hoặc nói thêm vài chi tiết để mình giải đáp ngay nhé:'
      : 'Mình đang lắng nghe bạn. Để mình hỗ trợ sát nhất, bạn có thể nói rõ hơn tình huống bạn đang quan tâm (về an toàn cơ thể, mạng xã hội, quy định pháp luật hay tâm lý), hoặc chọn một chủ đề bên dưới nhé:';
    return botSay(msg, { chips, alert: r && r.level >= 1 ? 'manual' : null });
  }

  async function startDisclosure(trigger, r) {
    const age = ageOf();
    S.mode = 'safety'; S.listenTurns = 0; setQuick();
    let text;
    if (trigger === 'detected') {
      const cat = topCat(r);
      const ack = cat && MSG.listen[cat] ? kidOr(MSG.listen[cat], age) : '';
      if (age === 'lon') text = MSG.discloseDetected.lon;
      else text = ack ? ack + '\n\n' + kidOr(MSG.safetyQ, age) : kidOr(MSG.discloseDetected, age);
    } else {
      text = age === 'lon' ? MSG.discloseManual.lon : kidOr(MSG.discloseManual, age);
    }
    const chips = age === 'lon'
      ? [{ label: 'Đang an toàn', act: 'safe' }, { label: 'Đang gặp nguy hiểm', act: 'danger', cls: 'warn' }, { label: 'Chưa rõ', act: 'unsure' }]
      : [{ label: 'Mình đang an toàn', act: 'safe' }, { label: 'Mình đang gặp nguy hiểm', act: 'danger', cls: 'warn' }, { label: 'Mình không chắc', act: 'unsure' }];
    return botSay(text, { chips, chipOpts: { big: true }, alert: trigger === 'detected' && r && r.level >= 2 ? 'manual' : null });
  }
  function topCat(r) {
    const order = ['tinh-duc', 'bao-luc', 'de-doa', 'bo-mac', 'bi-mat', 'ranh-gioi', 'can-giup', 'cam-xuc'];
    let best = null, bw = 0;
    for (const c of order) if ((r.cats[c] || 0) > bw) { bw = r.cats[c]; best = c; }
    return best;
  }
  async function respondListening(r, rel) {
    const age = ageOf();
    S.mode = 'listening'; S.listenTurns++; setQuick();
    const cat = topCat(r);
    let text; let chips;
    if (age === 'lon') {
      text = MSG.listenAdult[(S.listenTurns - 1) % MSG.listenAdult.length];
      chips = [{ label: 'Các bước nên làm', act: 'nextsteps' }, { label: 'Khi trẻ kể bị xâm hại', act: 'entry', val: 'khi-tre-ke' }, { label: 'Trách nhiệm báo tin', act: 'entry', val: 'trach-nhiem-bao-tin' }, { label: 'Chuẩn bị nội dung gọi 111', act: 'package' }];
    } else {
      if (cat && MSG.listen[cat]) text = kidOr(MSG.listen[cat], age);
      else { const g = kidOr(MSG.listen.generic, age); text = g[S.listenTurns % g.length]; }
      chips = [{ label: 'Mình nên làm gì bây giờ?', act: 'nextsteps' }, { label: 'Mình sợ kể với người lớn', act: 'entry', val: 'ke-cho-ai' }, { label: 'Chuẩn bị nội dung gọi 111', act: 'package' }, { label: 'Mình muốn dừng lại', act: 'stop', cls: 'ghost' }];
    }
    if (rel && age !== 'lon') chips.splice(2, 0, { label: 'Đọc thêm: ' + titleFor(rel, age), act: 'entry', val: rel.id, cls: 'ghost' });
    if (S.listenTurns >= 3 && S.listenTurns % 3 === 0) text += '\n\nBạn đã chia sẻ khá nhiều điều quan trọng. Nếu bạn muốn, mình có thể giúp bạn sắp xếp lại để kể với người lớn tin cậy hoặc khi gọi **111**.';
    return botSay(text, { chips, alert: r.level >= 2 ? 'manual' : null });
  }
  async function nextSteps() {
    const age = ageOf();
    const names = trustedNames();
    let t = age === 'lon' ? MSG.nextSteps.lon : kidOr(MSG.nextSteps, age);
    t = t.replace('{names}', names.length ? ` (ví dụ: ${names.slice(0, 3).join(', ')})` : '');
    const chips = [{ label: 'Chuyển thông tin tới 111', act: 'package' }, { label: 'Bàn tay tin cậy', act: 'tool', val: 'ban-tay' }, { label: 'Hít thở cùng ALLY', act: 'tool', val: 'hit-tho' }];
    return botSay(t, { chips, alert: 'manual' });

  async function respondDanger() {

    const now = Date.now();

  function maybeQuizReminder() {
    const st = quizStatus();

      setTimeout(() => botSay(st.never ? 'Bạn có muốn thử làm bài **tình huống định kỳ** để tự kiểm tra hiểu biết và cách ứng phó không? Chỉ mất khoảng 5 phút.' : 'Đã đến lúc làm lại bài **tình huống định kỳ** để ôn lại cách ứng phó rồi đấy.', { chips: [{ label: 'Làm bài tình huống', act: 'tab', val: 'tinh-huong' }] }), 400);
    }
